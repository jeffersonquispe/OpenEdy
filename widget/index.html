<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asistente EduTech</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <div class="brand">
          <span class="brand__avatar" aria-hidden="true">E</span>
          <div class="brand__text">
            <h1 class="brand__name">Asistente EduTech</h1>
            <span id="status" class="badge badge--success" role="status">En linea</span>
          </div>
        </div>
        <div class="modes" role="group" aria-label="Modo de conversacion">
          <button id="mode-text" type="button" class="modes__btn" aria-pressed="true">Texto</button>
          <button id="mode-voice" type="button" class="modes__btn" aria-pressed="false">Voz</button>
        </div>
      </header>

      <section id="text-view" class="view view--text" aria-label="Conversacion de texto">
        <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Mensajes"></div>
        <div id="chips" class="chips"></div>
        <form id="composer" class="composer">
          <label for="draft" class="sr-only">Escribe tu pregunta</label>
          <input id="draft" class="input" type="text" maxlength="1000" placeholder="Escribe tu pregunta" autocomplete="off" />
          <button id="send" type="submit" class="btn btn--primary">Enviar</button>
        </form>
      </section>

      <section id="voice-view" class="view view--voice" aria-label="Conversacion de voz" hidden>
        <p id="voice-status" class="voice__status" role="status">Toca el microfono para hablar</p>
        <div class="voice__control">
          <div class="orb">
            <span class="orb__ring" aria-hidden="true"></span>
            <button id="mic" type="button" class="orb__btn" aria-label="Iniciar conversacion de voz" aria-pressed="false">
              <span class="orb__bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            </button>
          </div>
          <p id="voice-hint" class="voice__hint">Toca para iniciar</p>
        </div>
        <div class="caption">
          <p id="caption-label" class="caption__label">Transcripcion</p>
          <p id="caption" class="caption__text">Tu conversacion aparecera aqui.</p>
        </div>
        <button id="back-to-text" type="button" class="btn btn--link">Terminar y volver al chat de texto</button>
      </section>
    </main>
    <div id="audio-sink" hidden></div>
    <script src="vendor/livekit-client.umd.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
